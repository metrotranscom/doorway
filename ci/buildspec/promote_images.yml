version: 0.2
env:
  shell: bash
phases:
  build:
    commands:
      # Triggered by a new "api" image landing in ECR, so CODEBUILD_RESOLVED_SOURCE_VERSION is
      # that image's digest, not a git sha. Resolve its "gitsha-" tag first, then wait for the
      # matching public/partners images (built separately) and promote all three together.
      - |
        TIMEOUT_SECONDS="${TIMEOUT_SECONDS:-300}"
        POLL_INTERVAL_SECONDS="${POLL_INTERVAL_SECONDS:-10}"
        DEST_TAG="${ECS_CLUSTER}-run"
        API_REPO="${ECR_NAMESPACE}/api"
        SRC_DIGEST="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

        echo "Resolving gitsha tag for [${API_REPO}@${SRC_DIGEST}]"

        SRC_TAG=$(aws ecr describe-images --repository-name "${API_REPO}" --image-ids imageDigest="${SRC_DIGEST}" --output json | jq --raw-output '.imageDetails[0].imageTags[]? | select(startswith("gitsha-"))' | head -n1)

        if [[ -z "${SRC_TAG}" ]]; then
          echo "No gitsha- tag found on [${API_REPO}@${SRC_DIGEST}]"
          exit 1
        fi

        echo "Resolved tag [${SRC_TAG}] for digest [${SRC_DIGEST}]"

        for SERVICE in api public partners; do
          REPO_NAME="${ECR_NAMESPACE}/${SERVICE}"

          echo "Waiting up to ${TIMEOUT_SECONDS}s for image manifest [${REPO_NAME}:${SRC_TAG}]"

          ELAPSED=0
          MANIFEST=""
          while [[ "${ELAPSED}" -lt "${TIMEOUT_SECONDS}" ]]; do
            MANIFEST=$(aws ecr batch-get-image --repository-name "${REPO_NAME}" --image-ids imageTag="${SRC_TAG}" --output json | jq --raw-output --join-output '.images[0].imageManifest')

            if [[ -n "${MANIFEST}" ]]; then
              break
            fi

            echo "No matching image found yet for repo [${REPO_NAME}] and tag [${SRC_TAG}], retrying in ${POLL_INTERVAL_SECONDS}s..."
            sleep "${POLL_INTERVAL_SECONDS}"
            ELAPSED=$((ELAPSED + POLL_INTERVAL_SECONDS))
          done

          if [[ -z "${MANIFEST}" ]]; then
            echo "Timed out after ${TIMEOUT_SECONDS}s waiting for repo [${REPO_NAME}] and tag [${SRC_TAG}]"
            exit 1
          fi

          echo "Manifest found"
          echo "Adding tag [${DEST_TAG}] to [${REPO_NAME}:${SRC_TAG}]"
          aws ecr put-image --repository-name "${REPO_NAME}" --image-tag "${DEST_TAG}" --image-manifest "${MANIFEST}"
        done
